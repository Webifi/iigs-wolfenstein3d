# Copy this file to start a custom source profile. See README.md for each field.
# File names are case-insensitive; no DOS executable is used.
format = 1
id = "shareware"
title = "Wolfenstein 3D shareware"
engine = "wolf3d"
publication = "shareware"
conversion = "conversion/stock.toml"
campaign = "campaigns/shareware.toml"
map_semantics = "map-semantics/wolf3d.toml"

[files]
# Missions 2 and 3 replace these three files; the other five remain .SOD.
MAPHEAD = "MAPHEAD.WL1"
GAMEMAPS = "GAMEMAPS.WL1"
VSWAP = "VSWAP.WL1"
VGADICT = "VGADICT.WL1"
VGAHEAD = "VGAHEAD.WL1"
VGAGRAPH = "VGAGRAPH.WL1"
AUDIOHED = "AUDIOHED.WL1"
AUDIOT = "AUDIOT.WL1"

[maps]
episodes = 1
count = 10
width = 64
height = 64
compression = "carmack-rlew"
# Keep high object numbers (including 256-259) intact during source decoding.

[audio]
sounds = 87 # Number of effects in each original sound bank.
music = 27 # IMF chunks follow the three sound banks.
# Original song names in source music-ID order; IDs begin at zero.
song_names = [
    "CORNER", "DUNGEON", "WARMARCH", "GETTHEM", "HEADACHE", "HITLWLTZ",
    "INTROCW3", "NAZI_NOR", "NAZI_OMI", "POW", "SALUTE", "SEARCHN",
    "SUSPENSE", "VICTORS", "WONDERIN", "FUNKYOU", "ENDLEVEL", "GOINGAFT",
    "PREGNANT", "ULTIMATE", "NAZI_RAP", "ZEROHOUR", "TWELFTH", "ROSTER",
    "URAHERO", "VICMARCH", "PACMAN",
]
# One song per source floor, in map order. Repeated songs share a bank.
floor_songs = [
    "GETTHEM", "SEARCHN", "POW", "SUSPENSE", "GETTHEM", "SEARCHN", "POW", "SUSPENSE", "WARMARCH", "CORNER",
]

[audio.events]
# These names define music coverage; they do not change native menu behavior.
title = "NAZI_NOR"
menu = "WONDERIN"
tally = "ENDLEVEL"
scores = "ROSTER"
victory = "URAHERO"

# Sprite samples used by this source edition's fitted floor palettes.
[graphics.palette_sampling]
include_objects = ["SPR_GRD_DEAD"]
exclude_objects = ["SPR_DEMO", "SPR_DEATHCAM"]

[[graphics.layouts]]
# A layout must match both counts; changing a count does not repair a bad file.
name = "apogee-1.4"
chunks = 156
pictures = 144
first_picture = 3
tile8_count = 35
# Original recordings starting at roles.demo_first. The native Wolf loop uses four.
demo_count = 4

[graphics.layouts.roles]
# Original VGAGRAPH chunk numbers, using names that describe their purpose.
title = 99
credits = 101
rating = 100
status_bar = 98
difficulty_first = 31
menu_cursor1 = 23
menu_cursor2 = 24
menu_options = 22
menu_control = 38
menu_customize = 39
menu_load = 40
menu_save = 41
menu_scores = 102
menu_getpsyched = 146
quit_text = 148
menu_logo = 13
ending_face = 11
tally_guy = 55
tally_colon = 56
tally_digit_first = 57
tally_letter_first = 68
tally_percent = 67
tally_exclamation = 94
tally_apostrophe = 95
tally_guy_alt = 96
victory_bj = 97
weapon_first = 103
key_first = 107
hud_blank = 110
hud_digit_first = 111
face_first = 121
demo_first = 151
ending_first = 155

