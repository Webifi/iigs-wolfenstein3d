# Source map words are kept as 16-bit values. Unmapped codes are reported.
# Named behaviors require corresponding native capabilities; these records
# describe source meaning and do not supply AI or rendering code.
# Plane 0 is geometry/areas; plane 1 is objects; plane 2 is unused in these games.
format = 1
sprite_catalog = "wolf3d-sprites.toml"
catalog_id = "wolf3d"
source_references = ["id Software WOLFSRC/WL_GAME.C: ScanInfoPlane, SetupGameLevel", "id Software WOLFSRC/WL_ACT1.C: statinfo", "id Software WOLFSRC/WL_DEF.H: map constants", "id Software WOLFSRC/WL_STATE.C: KillActor", "id Software WOLFSRC/WL_ACT2.C: actor states, projectiles, morphs"]
always_resources = ["player.weapons", "presentation.overlays"]

[[objects]]
name = "Preflagged elevator-texture door-side wall"
plane = 0
kind = "geometry"
behavior = "wall"
capabilities = ["map.walls", "map.door-side-wall"]
codes = [85]
# WL_ACT1.C SpawnDoor marks bit 6; WL_DRAW.C strips it for wall lookup.
# Cmd_Use tests plain 21, so this flagged wall is not an elevator trigger.
parameters = { wall_material = 21, door_side = true }

