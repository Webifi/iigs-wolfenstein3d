# Source-file identities and asset roles for this campaign.
# Filenames are case-insensitive; decoding reads data files only.
format = 1
id = "spear-mission2"
title = "Spear of Destiny: Return to Danger"
engine = "spear"
publication = "user-supplied"
conversion = "conversion/spear.toml"
campaign = "campaigns/spear-mission2.toml"
map_semantics = "map-semantics/spear.toml"

[files]
# Missions 2 and 3 replace these three files; the other five remain .SOD.
MAPHEAD = "MAPHEAD.SD2"
GAMEMAPS = "GAMEMAPS.SD2"
VSWAP = "VSWAP.SD2"
VGADICT = "VGADICT.SOD"
VGAHEAD = "VGAHEAD.SOD"
