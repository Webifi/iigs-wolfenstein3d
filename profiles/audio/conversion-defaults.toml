# Source settings of the accepted shareware arrangements.
# These preserve the existing mix and sample budgets; they contain no audio.
# channel/key identify MIDI parts AFTER instrument-defaults.toml is applied.
# Only an exact performed score and controller match selects a song entry.
# Samples are regenerated from complete Roland instrument tracks.
