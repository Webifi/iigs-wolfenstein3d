# Native residency and pinning weights; source samples and rates are selected elsewhere.
# Every reachable resource contributes all named sounds, including spawned dependents.
# Weights only rank DOC pins; they never change sample quality or effect volume.
# Common covers player, pickups, menus, tally and the retained legacy event ABI.
# DEATHSCREAM6 is the rare floor-10 death variant. Gretel includes the current
# native guard-shot fallback as well as the DOS boss-shot request.
